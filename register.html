<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - BFS</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="login-page">

    <div class="wrapper">
        <form id="registerForm">
            <h1>Register</h1>
            

            <div class="input-box">
                <input type="text" id="fullName" placeholder="Full Name" required>
            </div>
            <div class="input-box">
                <input type="email" id="email" placeholder="BFS email" required>
            </div>
            <div class="input-box">
                <input type="password" id="password" placeholder="Password" required>
            </div>
            <div class="input-box">
                <input type="password" id="confirmPassword" placeholder="Confirm Password" required>
            </div>

            <p class="error-msg" id="errorMsg"></p>
            <p class="success-msg" id="successMsg"></p>

            <button type="submit" class="btn">Create Account</button>

            <div class="divider">or</div>

            <button type="button" class="google-btn" id="googleSignIn">
                <!-- Google SVG icon -->
                <svg width="18" height="18" viewBox="0 0 48 48">
                    <path fill="#EA4335" d="M24 9.5c3.14 0 5.95 1.08 8.17 2.86l6.1-6.1C34.36 3.1 29.46 1 24 1 14.82 1 7.07 6.48 3.64 14.18l7.14 5.55C12.45 13.6 17.76 9.5 24 9.5z"/>
                    <path fill="#4285F4" d="M46.1 24.5c0-1.64-.15-3.22-.42-4.74H24v8.97h12.42c-.54 2.9-2.17 5.36-4.62 7.02l7.13 5.54C43.1 37.32 46.1 31.36 46.1 24.5z"/>
                    <path fill="#FBBC05" d="M10.78 28.27A14.6 14.6 0 0 1 9.5 24c0-1.49.26-2.93.72-4.27L3.08 14.18A23 23 0 0 0 1 24c0 3.68.87 7.16 2.64 10.18l7.14-5.91z"/>
                    <path fill="#34A853" d="M24 47c5.46 0 10.04-1.8 13.38-4.9l-7.13-5.54c-1.98 1.32-4.52 2.1-6.25 2.1-6.24 0-11.55-4.1-13.44-9.73l-7.14 5.91C7.07 42.52 14.82 47 24 47z"/>
                    <path fill="none" d="M1 1h46v46H1z"/>
                </svg>
                Sign up with Google
            </button>

            <div class="register-link">
                <p>Already have an account? <a href="login.html">Login</a></p>
            </div>

        </form>
    </div>

    <script type="module" src="register.js"></script>

</body>

</html>
